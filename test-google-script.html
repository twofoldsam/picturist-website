<!DOCTYPE html>
<html>
<head>
    <title>Test Google Apps Script</title>
</head>
<body>
    <h1>Test Google Apps Script</h1>
    <button onclick="testScript()">Test Script</button>
    <div id="result"></div>

    <script>
        async function testScript() {
            const url = 'https://script.google.com/macros/s/AKfycbzf2CIl1BY9mbjb53zdNcfPuWth0G8UD597uFT0ZgWGqieXJwjz8aLvzX15lzcO--FTUA/exec';
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        source: 'test'
                    })
                });
                
                const data = await response.json();
                document.getElementById('result').innerHTML = JSON.stringify(data, null, 2);
                console.log('Test result:', data);
            } catch (error) {
                document.getElementById('result').innerHTML = 'Error: ' + error.message;
                console.error('Test error:', error);
            }
        }
    </script>
</body>
</html>
